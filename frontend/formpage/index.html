<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="reg-content">
            <div class="header">
                <h1>Job Application<span>(Web)</span></h1>
            </div>
            <form action="/action">
                <div class="form-container">
                    <div class="form">
                        <label for="name">First Name</label>
                        <input type="text" placeholder="Enter First Name" id="name" name="name" required>
                    </div>

                    <div class="form">
                        <label for="lastname">Last Name</label>
                        <input type="text" placeholder="Enter Last Name" id="lastname" name="lastname">
                    </div>

                    <div class="form">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter Email" name="email" required>
                    </div>

                    <div class="form">
                        <label for="jobrole">Job Role</label>
                        <select id="jobrole" name="jobrole">
                            <option selected>Select Job Role</option>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="full stack">Full Stack Developer</option>
                            <option value="ui-ux">UI UX Designer</option>
                        </select>
                    </div>
                    
                    <div class="form" id="add">
                        <label for="address">Address</label>
                       <textarea id="address" placeholder="Enter Address" row="4" column="50" name="address"></textarea>
                    </div>

                    <div class="form">
                        <label for="city">City</label>
                        <input type="text" placeholder="Enter City Name" id="city" name="city">
                    </div>

                    <div class="form">
                        <label for="pin">Pincode</label>
                        <input type="number" placeholder="Enter Pincode" id="pin" name="pin">
                    </div>

                    <div class="form">
                        <label for="date">Date</label>
                        <input value= "2026-05-03" type="date" id="date" name="date">
                    </div>

                    <div class="form-control">
                        <label for="upload">Upload Your CV</label>
                        <input type="file" id="upload" name="upload">
                    </div>
                </div>
                <div class="btn">
                    <button type="submit">Apply Now</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
