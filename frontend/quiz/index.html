<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz game</title>
    <link rel="stylesheet" href="style.css"></head>
<body>
    
    <div class="container">

        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge with these fun questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>

        <div class="screen" id="quiz-screen">

            <div class="quiz-header">
                <h2 id="question-text">Question</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span >of<span id="total-questions">5</span> 
                    </p>
                    
                    <p>
                        score: <span id="score">0</span>
                    </p>
                    </div>
                </div>
                <div id="answer-container" class="answer-container">
                    <!--Answer will be here-->
                </div>
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
                </div>

                <div id="result-screen" class="screen">
                    <h1>Quiz Results</h1>
                    <div class="result-info">
                        <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
                        <h2 id="result-message">Good job!</h2>
                    </div>
                    <button id="restart-btn">Restart Quiz</button>
                </div>
        </div>
    <script src="app.js"></script>
</body>
</html>
